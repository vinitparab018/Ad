<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Article Editor | NewsOrbit</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/admin.css"><script src="/assets/js/editor.js" defer></script></head><body class="admin-body"><header class="admin-top"><a class="brand" href="/"><span class="brand-mark">N</span><span>News<span class="brand-accent">Orbit</span><small>ARTICLE EDITOR</small></span></a><a href="/admin/dashboard.html">← Dashboard</a></header><main class="admin-main editor-main"><div class="admin-heading"><div><p class="eyebrow">EDITORIAL WORKSPACE</p><h1 id="editor-heading">Create article</h1><p>Only publish original or properly licensed content.</p></div></div><form id="article-form" class="editor-form"><input type="hidden" id="article-id"><div class="editor-grid"><div class="editor-primary"><label for="title">Article title *</label><input id="title" name="title" required minlength="5" maxlength="240"><label for="slug">URL slug</label><input id="slug" name="slug" maxlength="120" placeholder="generated-from-title"><label for="summary">Summary *</label><textarea id="summary" name="summary" required minlength="20" maxlength="500" rows="3"></textarea><label for="body">Article body (HTML-safe tags supported) *</label><textarea id="body" name="body" required minlength="20" rows="16" placeholder="Write original article content. Use paragraphs such as &lt;p&gt;Your paragraph&lt;/p&gt;."></textarea><p class="field-help">Allowed formatting: paragraphs, headings, lists, emphasis, blockquotes and links. Scripts and unsafe attributes are removed.</p><label for="tags">Tags (comma-separated)</label><input id="tags" name="tags" maxlength="500"></div><aside class="editor-side"><label for="status">Publishing status</label><select id="status" name="status"><option value="draft">Save draft</option><option value="published">Publish now</option><option value="scheduled">Schedule</option><option value="unpublished">Unpublish</option></select><div id="schedule-field" hidden><label for="scheduled-at">Publish at (your local time)</label><input id="scheduled-at" type="datetime-local"></div><label for="category">Category *</label><select id="category" name="category" required><option>India</option><option>World</option><option>Business &amp; Finance</option><option>Technology &amp; AI</option><option>Sports</option><option>Entertainment</option><option>Lifestyle &amp; Health</option><option>Education &amp; Career</option><option>Opinion</option><option>Latest News</option></select><label for="author">Author</label><input id="author" name="author" value="NewsOrbit Desk" maxlength="120"><label for="image-url">Featured image URL</label><input id="image-url" type="url" maxlength="1000"><label for="image-credit">Image credit / rights note</label><input id="image-credit" maxlength="240"><label for="source-name">Source name</label><input id="source-name" value="NewsOrbit" maxlength="160"><label for="source-url">Source URL</label><input id="source-url" type="url" maxlength="1000"><label class="check-row"><input id="featured" type="checkbox"> Feature this article</label><hr><h2>SEO settings</h2><label for="seo-title">SEO title</label><input id="seo-title" maxlength="240"><label for="meta-description">Meta description</label><textarea id="meta-description" rows="3" maxlength="300"></textarea><label for="canonical-url">Canonical URL (optional)</label><input id="canonical-url" type="url" maxlength="1000"><button class="button button-primary" type="submit">Save article</button><a id="preview-link" class="button button-outline" href="#" target="_blank" rel="noopener" hidden>Preview published page</a><p id="editor-message" class="form-message" role="status"></p></aside></div></form></main></body></html>
